[project]
name = "ecobook-hub"
version = "1.0.0"
description = "Otwarta platforma wymiany i sprzedaży używanych podręczników szkolnych zintegrowana z danymi z dane.gov.pl (RSPO)"
authors = [
    { name = "EcoBook Hub Team" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]